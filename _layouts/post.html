<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
    <link rel="canonical" href="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
    <link rel="icon" href="{{ site.url }}/img/web-icon.ico">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Merriweather', Georgia, serif;
            line-height: 1.8;
            color: #333;
            background: #fff;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .back-link {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #666;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 40px;
        }

        .back-link:hover {
            color: #333;
        }

        .post-header {
            margin-bottom: 40px;
        }

        .post-title {
            font-family: 'Inter', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .post-meta {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #888;
        }

        .post-content {
            font-size: 1.1rem;
        }

        .post-content h1,
        .post-content h2,
        .post-content h3,
        .post-content h4 {
            font-family: 'Inter', sans-serif;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .post-content h2 {
            font-size: 1.5rem;
        }

        .post-content h3 {
            font-size: 1.25rem;
        }

        .post-content p {
            margin-bottom: 20px;
        }

        .post-content a {
            color: #0066cc;
        }

        .post-content ul,
        .post-content ol {
            margin: 20px 0;
            padding-left: 30px;
        }

        .post-content li {
            margin-bottom: 10px;
        }

        .post-content code {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 0.9em;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .post-content pre {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 25px 0;
        }

        .post-content pre code {
            background: none;
            padding: 0;
        }

        .post-content blockquote {
            border-left: 3px solid #ddd;
            padding-left: 20px;
            margin: 25px 0;
            color: #666;
            font-style: italic;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 25px 0;
        }

        .post-footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #e5e5e5;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <a href="{{ site.baseurl }}/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to home
    </a>

    <article>
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
        </header>

        <div class="post-content">
            {{ content }}
        </div>

        <footer class="post-footer">
            <p>Written by {{ site.data.profile.name }}</p>
        </footer>
    </article>
</body>
</html>
